# Verifies a requested tag against manifest.json, packages the plugin, and publishes a GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact x.y.z version that must match manifest.json
        required: true
        type: string
      draft:
        description: Create as a draft release (recommended when testing)
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Verify manifest version and prepare tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          DRAFT_INPUT: ${{ inputs.draft }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Release must be run from a branch." >&2
            exit 1
          fi
          node scripts/validate-version.mjs "$VERSION"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Requested tag '$VERSION' does not match manifest version '$MANIFEST_VERSION'." >&2
            exit 1
          fi
          if [[ "$REF_NAME" != "main" && ( "$DRAFT_INPUT" != "true" || "$PRERELEASE_INPUT" != "true" ) ]]; then
            echo "Releases from non-main branches must be both draft and prerelease." >&2
            exit 1
          fi
          RELEASE_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -c --arg version "$VERSION" '.[] | select(.tag_name == $version) | {tagName: .tag_name, isDraft: .draft}')"
          REUSE_DRAFT=false
          FORCE_TAG=false
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_TAG="$(jq -r '.tagName' <<<"$RELEASE_JSON")"
            RELEASE_DRAFT="$(jq -r '.isDraft' <<<"$RELEASE_JSON")"
            if [[ "$RELEASE_TAG" != "$VERSION" || "$RELEASE_DRAFT" != "true" || "$DRAFT_INPUT" != "true" ]]; then
              echo "Release $VERSION already exists and is not a replaceable draft." >&2
              exit 1
            fi
            echo "Rebuilding existing draft release $VERSION from $REF_NAME."
            REUSE_DRAFT=true
          elif git rev-parse "$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            if [[ "$DRAFT_INPUT" != "true" ]]; then
              echo "Tag $VERSION exists without a replaceable draft release; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Tag $VERSION exists but no release was found. Reusing the tag for a new draft release."
            FORCE_TAG=true
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -fa "$VERSION" -m "Release $VERSION"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$VERSION" -m "Release $VERSION"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT_INPUT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE_INPUT" >> "$GITHUB_OUTPUT"
          echo "reuse_draft=$REUSE_DRAFT" >> "$GITHUB_OUTPUT"
          echo "force_tag=$FORCE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build and package
        run: npm run release:prepare
      - name: Create installable archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: zip -j "dist/release/anniversary-reminder-${TAG}.zip" dist/release/main.js dist/release/manifest.json
      - name: Push tag after successful build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REUSE_DRAFT: ${{ steps.tag.outputs.reuse_draft }}
          FORCE_TAG: ${{ steps.tag.outputs.force_tag }}
        run: |
          if [[ "$REUSE_DRAFT" == "true" || "$FORCE_TAG" == "true" ]]; then
            git push --force origin "$TAG"
          else
            git push origin "$TAG"
          fi
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRAFT: ${{ steps.tag.outputs.draft }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          REUSE_DRAFT: ${{ steps.tag.outputs.reuse_draft }}
        run: |
          args=()
          if [[ "$DRAFT" == "true" ]]; then args+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          if [[ "$REUSE_DRAFT" == "true" ]]; then
            EXPECTED_ASSETS=$(printf '%s\n' "anniversary-reminder-${TAG}.zip" main.js manifest.json)
            while IFS= read -r asset; do
              if ! grep -Fxq "$asset" <<<"$EXPECTED_ASSETS"; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" dist/release/main.js dist/release/manifest.json dist/release/*.zip --clobber
            gh release edit "$TAG" --title "$TAG" --draft="$DRAFT" --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" dist/release/main.js dist/release/manifest.json dist/release/*.zip \
              --title "$TAG" --generate-notes "${args[@]}"
          fi
